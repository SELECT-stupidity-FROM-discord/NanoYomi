# Pushing a tag that starts with v builds Nano for every desktop platform and architecture, each with the extension
# host and a trimmed Java runtime, and attaches the builds to that tag's GitHub release.
# Hosted ARM runners are public-repo only, so ARM builds are cross-compiled on x64 (Windows, Linux) or Intel
# builds on the ARM Mac.
name: Build

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Made once up front, so the builds don't race to create it.
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

  build:
    name: ${{ matrix.name }}
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc, jdk: x64 }
          - { name: windows-arm64, os: windows-latest, target: aarch64-pc-windows-msvc, jdk: aarch64 }
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin, jdk: aarch64 }
          - { name: macos-x64, os: macos-latest, target: x86_64-apple-darwin, jdk: x64 }
          - { name: linux-x64, os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, jdk: x64 }
          - { name: linux-arm64, os: ubuntu-24.04, target: aarch64-unknown-linux-gnu, jdk: aarch64 }
    steps:
      - uses: actions/checkout@v4

      - run: rustup target add ${{ matrix.target }}

      # GPUI needs Wayland, X11, xkbcommon and fontconfig; wry needs WebKitGTK. ARM64 takes the arm64 packages
      # beside the native ones (Ubuntu multiarch) and a cross linker.
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          suffix=""
          extra=""
          if [ "${{ matrix.target }}" = aarch64-unknown-linux-gnu ]; then
            sudo dpkg --add-architecture arm64
            sudo sed -i 's/^Types: deb$/Types: deb\nArchitectures: amd64/' /etc/apt/sources.list.d/ubuntu.sources
            printf 'Types: deb\nURIs: http://ports.ubuntu.com/ubuntu-ports\nSuites: noble noble-updates noble-security\nComponents: main universe\nArchitectures: arm64\n' \
              | sudo tee /etc/apt/sources.list.d/arm64.sources
            suffix=":arm64"
            extra="gcc-aarch64-linux-gnu g++-aarch64-linux-gnu"
            {
              echo "PKG_CONFIG_ALLOW_CROSS=1"
              echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig"
              echo "PKG_CONFIG_SYSROOT_DIR=/"
              echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
              echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
              echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++"
            } >> "$GITHUB_ENV"
          fi
          sudo apt-get update
          pkgs="libwebkit2gtk-4.1-dev libgtk-3-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libasound2-dev"
          sudo apt-get install -y $extra $(for p in $pkgs; do printf '%s%s ' "$p" "$suffix"; done)

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          key: ${{ matrix.name }}-${{ hashFiles('app/Cargo.lock') }}
          restore-keys: ${{ matrix.name }}-

      # ring builds its C with clang for Windows ARM64, which the runner image ships.
      - name: Build app
        working-directory: app
        env:
          NANO_VERSION: ${{ github.ref_name }}
        run: cargo build --release --target ${{ matrix.target }}

      # The target's JDK is only a source of jmods for jlink, so it needn't run here.
      - uses: actions/setup-java@v4
        id: targetjdk
        with:
          distribution: microsoft
          java-version: 17
          architecture: ${{ matrix.jdk }}

      # The runner's own JDK, same distribution and version, since jlink needs jmods of its own version.
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 17

      # The host is plain JVM bytecode, so it's the same on every platform.
      - name: Build extension host
        working-directory: host
        shell: bash
        run: ./gradlew test installDist

      # The modules past jdeps' list are ones extensions reach at run time: java.desktop for Bitmap and Canvas,
      # EC for TLS, extra charsets, java.sql dates and locale data for date parsing.
      - name: Bundle
        shell: bash
        run: |
          target_jdk="${{ steps.targetjdk.outputs.path }}"
          want=$(grep '^JAVA_VERSION=' "$target_jdk/release")
          have=$(grep '^JAVA_VERSION=' "$JAVA_HOME/release")
          [ "$want" = "$have" ] || { echo "jlink $have can't link jmods from $want"; exit 1; }
          exe=""; [ "${{ runner.os }}" = Windows ] && exe=".exe"
          mkdir -p dist/nano
          cp "app/target/${{ matrix.target }}/release/nano-reader$exe" dist/nano/
          cp -R host/build/install/yomi-host dist/nano/host
          "$JAVA_HOME/bin/jlink" --module-path "$target_jdk/jmods" \
            --add-modules java.base,java.desktop,java.instrument,java.logging,java.xml,jdk.unsupported,jdk.crypto.ec,jdk.charsets,java.sql,jdk.localedata \
            --include-locales=en,ja,ko,zh,es,pt,fr,de,it,ru,id,vi,th,tr,ar,pl,uk \
            --strip-debug --no-man-pages --no-header-files --compress=2 --output dist/nano/host/jre
          test -f "dist/nano/host/jre/bin/java$exe"
          du -sh dist/nano dist/nano/host/jre
          # A tarball keeps the executable bits that upload-artifact's zip drops. Windows doesn't need them.
          cd dist
          if [ -n "$exe" ]; then 7z a -bso0 "../nano-${{ matrix.name }}.zip" nano; else tar -czf "../nano-${{ matrix.name }}.tar.gz" nano; fi

      # A .app wraps the binary, host and runtime, and a .dmg holds the app. It is ad-hoc signed, so Gatekeeper asks on first launch instead of calling it damaged.
      - name: macOS app and dmg
        if: runner.os == 'macOS'
        run: |
          version="${GITHUB_REF_NAME#v}"
          c=dist/Nano.app/Contents
          mkdir -p "$c/MacOS" "$c/Resources" dist/Nano.iconset
          cp -R dist/nano/. "$c/MacOS/"
          for s in 16 32 128 256 512; do
            sips -z $s $s packaging/nano.png --out dist/Nano.iconset/icon_${s}x${s}.png >/dev/null
            sips -z $((s*2)) $((s*2)) packaging/nano.png --out dist/Nano.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns dist/Nano.iconset -o "$c/Resources/Nano.icns"
          cat > "$c/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Nano</string>
            <key>CFBundleDisplayName</key><string>Nano</string>
            <key>CFBundleIdentifier</key><string>app.nano.Reader</string>
            <key>CFBundleExecutable</key><string>nano-reader</string>
            <key>CFBundleIconFile</key><string>Nano</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF
          # codesign takes the JRE's legal/java.xml folder for a nested bundle, so the notices move out of MacOS.
          [ -d "$c/MacOS/host/jre/legal" ] && mv "$c/MacOS/host/jre/legal" "$c/Resources/jre-legal"
          codesign --force --deep -s - dist/Nano.app
          mkdir dist/dmg && cp -R dist/Nano.app dist/dmg/ && ln -s /Applications dist/dmg/Applications
          hdiutil create -volname Nano -srcfolder dist/dmg -ov -format UDZO "nano-${{ matrix.name }}.dmg"

      # The GNOME runtime carries WebKitGTK and the graphics libraries, so the bundle runs on any distro with Flatpak.
      # ARM64 runs under QEMU, which is slow but only copies files.
      - uses: docker/setup-qemu-action@v3
        if: runner.os == 'Linux' && matrix.jdk == 'aarch64'

      - name: Flatpak
        if: runner.os == 'Linux'
        run: |
          arch=x86_64; [ "${{ matrix.jdk }}" = aarch64 ] && arch=aarch64
          sudo apt-get install -y flatpak flatpak-builder
          # Ubuntu 24.04 blocks the user namespaces bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive --arch=$arch flathub org.gnome.Platform//49 org.gnome.Sdk//49
          mkdir stage && cp -a dist/nano stage/ && cp -a packaging stage/
          flatpak-builder --user --arch=$arch --force-clean --disable-rofiles-fuse --repo=repo build packaging/flatpak.yml
          # Every library the binary needs must resolve inside the runtime, or it won't start for users.
          if [ "$arch" = x86_64 ]; then
            missing=$(flatpak build build ldd /app/nano/nano-reader 2>&1 | grep -E 'not found|version' || true)
            [ -z "$missing" ] || { echo "$missing"; exit 1; }
          fi
          flatpak build-bundle --arch=$arch --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo repo "nano-${{ matrix.name }}.flatpak" app.nano.Reader
          ls -lh nano-${{ matrix.name }}.flatpak

      # Each file goes up as-is, so the .dmg, .flatpak and .tar.gz aren't wrapped in a zip.
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" nano-${{ matrix.name }}.* --clobber --repo "$GITHUB_REPOSITORY"
